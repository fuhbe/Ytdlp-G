name: Lite Windows x64
on:
  push:
    branches: [feat/lite-compatible-edition]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: ./lite/build.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: lite-windows
          path: artifacts/*
          compression-level: 0
