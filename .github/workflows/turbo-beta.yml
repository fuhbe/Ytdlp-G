name: Publish verified Turbo beta
on:
  push:
    tags: ['v1.4.0-beta.3']
permissions:
  actions: read
  contents: write
jobs:
  prerelease:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_RUN: '46063249135'
      PREFIX: Ytdlp-G-1.4.0-beta.3
      TAG: v1.4.0-beta.3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify provenance and download tested artifacts
        run: |
          set -eu
          gh run view "$BUILD_RUN" --json headSha,name,conclusion > run.json
          jq -e '.name=="Windows build" and .conclusion=="success"' run.json
          git diff --exit-code "$(jq -r .headSha run.json)" HEAD -- src scripts tests assets installer Ytdlp-G.spec pyproject.toml requirements*.txt requirements-build.lock .github/workflows/windows.yml
          gh run download "$BUILD_RUN" -n turbo-windows -D binaries
          gh run download "$BUILD_RUN" -n Ytdlp-G-validation-13 -D validation
          test "$(gh api repos/$GITHUB_REPOSITORY/releases/latest --jq .tag_name)" = v1.3.0
          (cd binaries && sha256sum -c SHA256SUMS.txt --ignore-missing)
          for name in packaged portable installed; do
            jq -e '.result=="passed" and .versions.app=="1.4.0-beta.3"' "validation/$name-smoke.json"
          done
          python - <<'PY'
          from xml.etree import ElementTree as ET
          suite=ET.parse("validation/test-results.xml").getroot().find("testsuite")
          assert suite.get("errors")==suite.get("failures")=="0"
          print(suite.attrib)
          PY
      - name: Assemble beta files and publish as prerelease
        run: |
          set -eu
          mkdir out
          mv binaries/Ytdlp-G-Setup.exe "out/$PREFIX-Setup.exe"
          mv binaries/Ytdlp-G-portable.zip "out/$PREFIX-portable.zip"
          git archive --format=zip --prefix=Ytdlp-G/ -o "out/$PREFIX-source.zip" HEAD
          cp docs/validation/beta3-linux.xml validation/linux-tests.xml
          (cd validation && zip -q "../out/$PREFIX-validation.zip" *.json *.xml)
          cp docs/turbo/benchmarks-beta3.md "out/$PREFIX-benchmarks.md"
          (cd out && sha256sum * > SHA256SUMS.txt)
          gh release create "$TAG" --verify-tag --draft --prerelease --latest=false --title 'Ytdlp-G 1.4.0 Beta 3 — Compatibility Update' --notes-file docs/turbo/beta3.md out/*
          gh release edit "$TAG" --draft=false --prerelease --latest=false
          gh release view "$TAG" --json isDraft,isPrerelease,assets --jq '{isDraft,isPrerelease,assets:[.assets[].name]}'
