name: Feature request
description: Suggest an improvement that fits the compact interface.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe your use case and what is difficult today.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Suggested change
      description: How could this fit into the existing simple workflow?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
